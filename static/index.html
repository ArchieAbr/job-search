<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Search</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>Job Search</h1>
      <p>
        Search Indeed, LinkedIn &amp; Glassdoor from one place &mdash; results
        saved locally
      </p>
    </header>

    <div class="layout">
      <!-- Sidebar: search history -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>History</h2>
          <button
            type="button"
            id="clear-all-btn"
            class="btn-clear-all"
            title="Delete all search history"
          >
            Clear all
          </button>
        </div>
        <ul id="history-list">
          <li class="empty-item">No searches yet.</li>
        </ul>
      </aside>

      <!-- Main content -->
      <main class="content">
        <!-- Search form -->
        <form id="search-form" novalidate>
          <!-- Mode toggle -->
          <div class="mode-toggle-row">
            <span class="mode-toggle-label">Search mode</span>
            <div class="mode-toggle" role="group" aria-label="Search mode">
              <button
                type="button"
                class="mode-btn active"
                data-mode="standard"
                id="mode-standard"
              >
                Standard
              </button>
              <button
                type="button"
                class="mode-btn"
                data-mode="ai"
                id="mode-ai"
              >
                ✦ AI
              </button>
              <button
                type="button"
                class="mode-btn"
                data-mode="cv"
                id="mode-cv"
              >
                📄 CV
              </button>
            </div>
            <span id="mode-hint" class="mode-hint"
              >Enter a specific job title or keyword</span
            >
          </div>

          <!-- CV upload area (shown in CV mode only) -->
          <div id="cv-upload-area" class="cv-upload-area hidden">
            <label id="cv-dropzone" class="cv-dropzone" for="cv-file-input">
              <span class="cv-drop-icon">📄</span>
              <span class="cv-drop-primary"
                >Drop your CV here, or <u>browse</u></span
              >
              <span class="cv-drop-secondary">PDF, DOCX or TXT · max 5 MB</span>
              <input
                type="file"
                id="cv-file-input"
                accept=".pdf,.docx,.txt"
                class="cv-file-hidden"
              />
            </label>
            <div id="cv-status" class="cv-status hidden"></div>
          </div>

          <div class="form-row">
            <div class="form-group grow">
              <label for="query"
                >Job title / keyword <span class="required">*</span></label
              >
              <input
                type="text"
                id="query"
                placeholder="e.g. Python Developer"
                required
              />
            </div>
            <div class="form-group grow">
              <label for="location">Location</label>
              <input
                type="text"
                id="location"
                placeholder="e.g. London, Manchester"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Sites</label>
              <div class="checkbox-group">
                <label class="check-label">
                  <input type="checkbox" name="sites" value="indeed" checked />
                  Indeed
                </label>
                <label class="check-label">
                  <input
                    type="checkbox"
                    name="sites"
                    value="linkedin"
                    checked
                  />
                  LinkedIn
                </label>
                <label
                  class="check-label"
                  title="Glassdoor is currently unreliable — their API is frequently blocking requests"
                >
                  <input type="checkbox" name="sites" value="glassdoor" />
                  Glassdoor <span class="site-warn">(unstable)</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="job_type">Job type</label>
              <select id="job_type">
                <option value="">Any</option>
                <option value="fulltime">Full-time</option>
                <option value="parttime">Part-time</option>
                <option value="contract">Contract</option>
                <option value="internship">Internship</option>
              </select>
            </div>

            <div class="form-group">
              <label for="experience_level">Experience</label>
              <select id="experience_level">
                <option value="">Any</option>
                <option value="junior">Junior</option>
                <option value="mid">Mid-level</option>
                <option value="senior">Senior</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="salary_min">Min salary (£)</label>
              <input
                type="number"
                id="salary_min"
                placeholder="e.g. 40000"
                min="0"
                step="1000"
              />
            </div>
            <div class="form-group">
              <label for="results_wanted">Max results</label>
              <input
                type="number"
                id="results_wanted"
                value="50"
                min="5"
                max="200"
                step="5"
              />
            </div>
            <div class="form-group align-end">
              <label class="check-label inline-check">
                <input type="checkbox" id="is_remote" /> Remote only
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="search-btn">Search Jobs</button>
          </div>
        </form>

        <!-- Status bar -->
        <div id="status-bar" class="status-bar hidden"></div>

        <!-- Progress bar (shown during search) -->
        <div id="progress-container" class="progress-container hidden">
          <div class="progress-header">
            <span id="progress-msg" class="progress-msg">Starting…</span>
            <span id="progress-pct" class="progress-pct">0%</span>
          </div>
          <div class="progress-sub" id="progress-sub"></div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <!-- AI expansion info -->
        <div id="expansion-panel" class="expansion-panel hidden"></div>

        <!-- Site error warnings -->
        <div id="site-errors" class="site-errors hidden"></div>

        <!-- Results -->
        <div id="results-area">
          <p id="empty-state" class="empty-state">
            Enter a job title above to start searching.
          </p>
          <div id="results-table-container"></div>
        </div>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
