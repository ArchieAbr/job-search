[pytest]
markers =
    live: marks tests as live network tests that make real HTTP requests (deselect with '-m "not live"')
filterwarnings =
    # jobspy makes unverified HTTPS requests internally — not fixable from our code
    ignore::urllib3.exceptions.InsecureRequestWarning
    # jobspy uses Pydantic v1's .dict() — deprecated in Pydantic v2, fixed upstream in a future jobspy release
    ignore::pydantic.warnings.PydanticDeprecatedSince20
